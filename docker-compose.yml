services:
  chrysopeia:
    build: .
    container_name: chrysopeia
    ports:
      - "${PORT:-8080}:8080"
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ${MEDIA_PATH:-./media}:/media
      - chrysopeia-data:/data
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///data/chrysopeia.db}
      - MEDIA_PATH=/media
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-2}
      - DEFAULT_CODEC=${DEFAULT_CODEC:-av1}
      - DEFAULT_QUALITY=${DEFAULT_QUALITY:-28}
      - HW_ACCEL=${HW_ACCEL:-auto}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  chrysopeia-data:
