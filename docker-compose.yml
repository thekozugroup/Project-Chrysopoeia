# Chrysopoeia with CPU encoding. Works on any Docker host.
#
#   cp .env.example .env        # optional: adjust paths and ids
#   docker compose up -d
#   open http://localhost:8080
#
# Add a GPU with an overlay file:
#   NVIDIA:     docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up -d
#   Intel/AMD:  docker compose -f docker-compose.yml -f docker-compose.intel-amd.yml up -d
name: chrysopoeia

services:
  chrysopoeia:
    # To run an image built from this checkout (`make docker`), set
    # CHRYSOPOEIA_IMAGE=chrysopoeia:dev in .env.
    image: ${CHRYSOPOEIA_IMAGE:-ghcr.io/thekozugroup/chrysopoeia:latest}
    container_name: chrysopoeia
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      # Database and settings. Back this folder up.
      - ./config:/config
      # Your media. Chrysopoeia replaces files here once each result is verified.
      - ${MEDIA_PATH:-./media}:/media
      # Optional: a fast disk (SSD) for in-progress files. Without it, work
      # files are written next to each original.
      # - ${TEMP_PATH:-./temp}:/temp
    environment:
      # Files are written as this user and group. Use the owner of your media
      # (run `id` on the host). Unraid uses 99 and 100.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      # auto picks the best verified hardware encoder, else the CPU.
      # Other values: cpu, nvenc, qsv, vaapi, amf
      HW_ACCEL: ${HW_ACCEL:-auto}
      # Jobs at once. Leave empty for automatic (based on CPU, memory and GPU).
      MAX_JOBS: ${MAX_JOBS:-}
      # Folders (inside the container) to add as libraries on first start,
      # comma-separated, e.g. /media/Movies,/media/TV. You can also add them in the app.
      LIBRARIES: ${LIBRARIES:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
