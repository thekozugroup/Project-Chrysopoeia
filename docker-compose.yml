services:
  chrysopoeia:
    build: .
    image: chrysopoeia:latest
    container_name: chrysopoeia
    ports:
      - "${PORT:-8080}:8080"
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ${MEDIA_PATH:-./media}:/media
      - chrysopoeia-data:/data
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///data/chrysopoeia.db}
      - MEDIA_PATH=/media
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-2}
      - DEFAULT_CODEC=${DEFAULT_CODEC:-av1}
      - DEFAULT_QUALITY=${DEFAULT_QUALITY:-28}
      - HW_ACCEL=${HW_ACCEL:-auto}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        tag: "chrysopoeia|{{.Name}}"
    deploy:
      resources:
        limits:
          cpus: "${CPU_LIMIT:-0}"
          memory: "${MEMORY_LIMIT:-0}"
        # Uncomment the reservations block below for NVIDIA GPU passthrough.
        # For non-NVIDIA systems, leave commented out and set HW_ACCEL=auto
        # to use CPU-based encoding.
        #
        # reservations:
        #   devices:
        #     - driver: nvidia
        #       count: all
        #       capabilities: [gpu]
    networks:
      - chrysopoeia-net

  # --------------------------------------------------------------------------
  # Watchtower: auto-update running containers (optional)
  # Uncomment to enable automatic image updates from a registry.
  # --------------------------------------------------------------------------
  # watchtower:
  #   image: containrrr/watchtower
  #   container_name: watchtower
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   environment:
  #     - WATCHTOWER_CLEANUP=true
  #     - WATCHTOWER_POLL_INTERVAL=3600
  #     - WATCHTOWER_LABEL_ENABLE=true
  #   restart: unless-stopped
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "5m"
  #       max-file: "2"
  #   networks:
  #     - chrysopoeia-net

volumes:
  chrysopoeia-data:

networks:
  chrysopoeia-net:
    driver: bridge
