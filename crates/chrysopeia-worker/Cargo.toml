[package]
name = "chrysopeia-worker"
description = "Transcoding worker for Chrysopeia job processing"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
oximedia = [
    "dep:oximedia-transcode",
    "dep:oximedia-accel",
    "dep:oximedia-jobs",
    "dep:oximedia-presets",
    "dep:oximedia-compat-ffmpeg",
]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio-util = "0.7"
chrysopeia-core = { workspace = true }
chrysopeia-hwdetect = { workspace = true }
oximedia-transcode = { workspace = true, optional = true }
oximedia-accel = { workspace = true, optional = true }
oximedia-jobs = { workspace = true, optional = true }
oximedia-presets = { workspace = true, optional = true }
oximedia-compat-ffmpeg = { workspace = true, optional = true }
