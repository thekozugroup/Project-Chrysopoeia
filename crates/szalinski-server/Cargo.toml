[package]
name = "szalinski-server"
description = "HTTP API, WebSocket, job queue and web UI host for Szalinski"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "szalinski"
path = "src/main.rs"

[dependencies]
szalinski-core = { workspace = true }
szalinski-hwdetect = { workspace = true }
szalinski-scanner = { workspace = true }
szalinski-worker = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
axum = { workspace = true }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["catch-panic"] }
sqlx = { workspace = true }
globset = { workspace = true }
serde_path_to_error = "0.1"
# The HTTP server's connection limits (see `http.rs`); axum already uses both.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
tempfile = { workspace = true }
# Folders that stop answering, in tests (`slow_fs::hang`).
szalinski-worker = { workspace = true, features = ["test-hooks"] }
tokio-tungstenite = "0.28"
