[workspace]
resolver = "2"
members = [
    "crates/chrysopeia-core",
    "crates/chrysopeia-server",
    "crates/chrysopeia-worker",
    "crates/chrysopeia-scanner",
    "crates/chrysopeia-hwdetect",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/michaelwong/chrysopeia"

[workspace.dependencies]
# OxiMedia crates (optional - enable with "oximedia" feature on each crate)
oximedia-core = { git = "https://github.com/cool-japan/oximedia", branch = "master" }
oximedia-transcode = { git = "https://github.com/cool-japan/oximedia", branch = "master" }
oximedia-accel = { git = "https://github.com/cool-japan/oximedia", branch = "master" }
oximedia-jobs = { git = "https://github.com/cool-japan/oximedia", branch = "master" }
oximedia-codec = { git = "https://github.com/cool-japan/oximedia", branch = "master" }
oximedia-audio = { git = "https://github.com/cool-japan/oximedia", branch = "master" }
oximedia-container = { git = "https://github.com/cool-japan/oximedia", branch = "master" }
oximedia-quality = { git = "https://github.com/cool-japan/oximedia", branch = "master" }
oximedia-compat-ffmpeg = { git = "https://github.com/cool-japan/oximedia", branch = "master" }
oximedia-presets = { git = "https://github.com/cool-japan/oximedia", branch = "master" }
oximedia-io = { git = "https://github.com/cool-japan/oximedia", branch = "master" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["ws", "json", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
notify = "7"
walkdir = "2"
globset = "0.4"

# Internal crates
chrysopeia-core = { path = "crates/chrysopeia-core" }
chrysopeia-hwdetect = { path = "crates/chrysopeia-hwdetect" }
chrysopeia-scanner = { path = "crates/chrysopeia-scanner" }
chrysopeia-worker = { path = "crates/chrysopeia-worker" }
