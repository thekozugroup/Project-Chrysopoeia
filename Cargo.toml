[workspace]
resolver = "2"
members = [
    "crates/szalinski-core",
    "crates/szalinski-server",
    "crates/szalinski-worker",
    "crates/szalinski-scanner",
    "crates/szalinski-hwdetect",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/thekozugroup/Project-Chrysopoeia"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"

# Web framework
axum = { version = "0.8", features = ["ws", "json"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "compression-gzip", "set-header"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
notify = "7"
walkdir = "2"
globset = "0.4"
tempfile = "3"

# Internal crates
szalinski-core = { path = "crates/szalinski-core" }
szalinski-hwdetect = { path = "crates/szalinski-hwdetect" }
szalinski-scanner = { path = "crates/szalinski-scanner" }
szalinski-worker = { path = "crates/szalinski-worker" }

# Smaller, faster debug builds. Line tables keep backtraces useful.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
