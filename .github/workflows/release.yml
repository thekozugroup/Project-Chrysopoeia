name: Release

# Publishes ghcr.io/<owner>/chrysopoeia for linux/amd64 and linux/arm64:
#   push to main  -> :latest and :sha-<short>
#   tag v1.2.3    -> :1.2.3, :1.2, :1 and :sha-<short>
# The amd64 image must pass the end-to-end smoke test before anything is pushed.
# First release: make the package public (GitHub -> Packages -> chrysopoeia ->
# Package settings -> Change visibility) so Unraid and Docker can pull it
# without logging in.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build, test and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        # Registry paths must be lowercase.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/chrysopoeia" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        env:
          # GHCR shows the description from the multi-arch index's annotations.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha
          labels: |
            org.opencontainers.image.title=Chrysopoeia
            org.opencontainers.image.description=Self-hosted media transcoder: pick a folder and a goal; every file is verified before it replaces the original.
            org.opencontainers.image.licenses=Apache-2.0
          annotations: |
            org.opencontainers.image.title=Chrysopoeia
            org.opencontainers.image.description=Self-hosted media transcoder: pick a folder and a goal; every file is verified before it replaces the original.
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build linux/amd64 for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: chrysopoeia:release-test
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=release
          cache-to: type=gha,mode=max,scope=amd64

      - name: End-to-end smoke test
        run: scripts/e2e-smoke.sh chrysopoeia:release-test

      - name: Build and push linux/amd64 + linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
