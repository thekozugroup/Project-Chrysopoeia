name: Release

# Publishes ghcr.io/<owner>/chrysopoeia for linux/amd64 and linux/arm64:
#   push to main  -> :latest and :sha-<short>   (image version main-<short sha>)
#   tag v1.2.3    -> :1.2.3, :1.2, :1 and :sha-<short>   (image version 1.2.3)
#                    A tag never moves :latest, which always follows main.
#                    The tag must match `version` in Cargo.toml
#                    ([workspace.package]), which the server reports.
#   manual run on any other branch (Actions -> Release -> Run workflow)
#                 -> :edge and :sha-<short>   (image version <branch>-<short sha>)
#     so an image can be tried (e.g. on Unraid, Repository set to :edge)
#     before the branch is merged. It never moves :latest.
# The amd64 image must pass the entrypoint tests and both end-to-end tests (API
# and browser) before anything is pushed. The arm64 image is cross-compiled and
# is not run here.
# The first image ever published, including a first :edge from a manual run on
# a branch, creates the package as private. Make it public once (GitHub ->
# Packages -> chrysopoeia -> Package settings -> Change visibility) so Unraid
# and Docker can pull it without logging in. The run's summary repeats this.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # Drives web/e2e/smoke.mjs (scripts/e2e-browser.sh) against the built image.
  PLAYWRIGHT_VERSION: "1.56.1"

jobs:
  image:
    name: Build, test and push
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        # Registry paths must be lowercase.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/chrysopoeia" >> "$GITHUB_ENV"

      - name: Version string
        # The image version: shown in the first line of the container log
        # ("Chrysopoeia 0.2.0 (image main-1a2b3c4)") and in the OCI version
        # label. Tags: v1.2.3 -> 1.2.3. Branches: <branch>-<short sha>, so a
        # bug report from a :latest image names the exact commit. The server
        # itself (API, "is running" log line) reports Cargo.toml's version.
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml)
            if [[ "$cargo_version" != "$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version = \"$cargo_version\" in Cargo.toml ([workspace.package]), which the server reports. Set it to \"$version\", commit, and move the tag to that commit."
              exit 1
            fi
          else
            branch="${GITHUB_REF_NAME//[^A-Za-z0-9._-]/-}"
            version="${branch}-${GITHUB_SHA::7}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        env:
          # GHCR shows the description from the multi-arch index's annotations.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          # Only the explicit rule below sets :latest (pushes to main); by
          # default a version tag would move it too, possibly backwards.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=edge,enable=${{ github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha
          # The version label overrides metadata-action's default, which is
          # "latest" for builds from main.
          labels: |
            org.opencontainers.image.title=Chrysopoeia
            org.opencontainers.image.description=Self-hosted media transcoder: pick a folder and a goal; every file is verified before it replaces the original.
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          annotations: |
            org.opencontainers.image.title=Chrysopoeia
            org.opencontainers.image.description=Self-hosted media transcoder: pick a folder and a goal; every file is verified before it replaces the original.
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - name: Build linux/amd64 for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: chrysopoeia:release-test
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}
            CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=release
          cache-to: type=gha,mode=max,scope=amd64

      - name: Entrypoint tests
        run: docker/test-entrypoint.sh chrysopoeia:release-test

      - name: End-to-end smoke test (API)
        run: scripts/e2e-smoke.sh chrysopoeia:release-test

      - name: Install Playwright and Chromium
        run: |
          npm install --global "playwright@${PLAYWRIGHT_VERSION}"
          playwright install --with-deps chromium

      - name: End-to-end smoke test (first run in a browser)
        run: scripts/e2e-browser.sh chrysopoeia:release-test

      - name: Build and push linux/amd64 + linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}
            CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          {
            echo "## Published image version $VERSION"
            echo
            echo "Tags:"
            echo
            while IFS= read -r tag; do
              if [ -n "$tag" ]; then echo "- \`$tag\`"; fi
            done <<< "$TAGS"
            echo
            echo "If this is the first image ever published (including a first \`:edge\` from a branch), the package is private and Unraid and Docker are refused when pulling it. Make it public once: open https://github.com/${GITHUB_REPOSITORY}/pkgs/container/chrysopoeia, then **Package settings > Change visibility > Public**."
          } >> "$GITHUB_STEP_SUMMARY"
